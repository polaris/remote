name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: macOS Apple Clang
            os: macos-15
            cc: clang
            cxx: clang++
          # No cc/cxx: Conan and CMake detect MSVC themselves. Visual Studio is a multi-config
          # generator, for which Conan names the configure preset conan-default.
          - name: Windows MSVC
            os: windows-2025
            configure_preset: conan-default
          - name: Address and UB sanitizers
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            cmake_options: -DREMOTE_SANITIZERS=address,undefined
          - name: Thread sanitizer
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            cmake_options: -DREMOTE_SANITIZERS=thread
            tsan_options: halt_on_error=1
          - name: clang-tidy
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            cmake_options: -DREMOTE_CLANG_TIDY=ON
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # Stop at the first data race instead of continuing with corrupted state.
      TSAN_OPTIONS: ${{ matrix.tsan_options }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install tools
        run: |
          pip install -r requirements.txt
          conan profile detect

      - uses: actions/cache@v6
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os }}-${{ matrix.cc }}-${{ hashFiles('conanfile.py') }}

      - name: Install dependencies
        run: conan install . --build=missing -s build_type=Debug -s compiler.cppstd=20

      - name: Configure
        run: cmake --preset ${{ matrix.configure_preset || 'conan-debug' }} -DREMOTE_WARNINGS_AS_ERRORS=ON ${{ matrix.cmake_options }}

      - name: Build
        run: cmake --build --preset conan-debug --parallel

      - name: Test
        run: ctest --preset conan-debug --output-on-failure

  package:
    name: Conan package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install tools
        run: |
          pip install -r requirements.txt
          conan profile detect

      - uses: actions/cache@v6
        with:
          path: ~/.conan2/p
          key: conan-package-${{ hashFiles('conanfile.py') }}

      - name: Create package
        run: conan create . --build=missing -s compiler.cppstd=20
