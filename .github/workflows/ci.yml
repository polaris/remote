name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: macOS Apple Clang
            os: macos-15
            cc: clang
            cxx: clang++
          - name: Address and UB sanitizers
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            cmake_options: -DREMOTE_SANITIZERS=address,undefined
          - name: Thread sanitizer
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            cmake_options: -DREMOTE_SANITIZERS=thread
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect

      - uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os }}-${{ matrix.cc }}-${{ hashFiles('conanfile.py') }}

      - name: Install dependencies
        run: conan install . --build=missing -s build_type=Debug -s compiler.cppstd=20

      - name: Configure
        run: cmake --preset conan-debug -DREMOTE_WARNINGS_AS_ERRORS=ON ${{ matrix.cmake_options }}

      - name: Build
        run: cmake --build --preset conan-debug --parallel

      - name: Test
        run: ctest --preset conan-debug --output-on-failure

  package:
    name: Conan package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect

      - uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-package-${{ hashFiles('conanfile.py') }}

      - name: Create package
        run: conan create . --build=missing -s compiler.cppstd=20
